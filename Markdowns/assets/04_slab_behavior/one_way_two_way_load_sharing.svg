<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="840" viewBox="0 0 1450 840" role="img" aria-labelledby="title description">
  <title id="title">Compatibility-based load sharing between slab strips</title>
  <desc id="description">A technical schematic compares crossing unit-width strips in a square slab panel and a two-to-one rectangular slab panel. Both strips deflect equally at their intersection; the shorter-span x strip carries sixteen times the load of the longer y strip in the two-to-one case.</desc>
  <defs>
    <style>.title{font:400 31px Arial,sans-serif;fill:#334155}.body{font:400 20px Arial,sans-serif;fill:#334155}.label{font:400 18px Arial,sans-serif;fill:#334155}.small{font:400 16px Arial,sans-serif;fill:#53657a}.math{font:italic 23px Georgia,serif;fill:#26364a}.result{font:700 22px Arial,sans-serif;fill:#26364a}.caption{font:italic 16px Arial,sans-serif;fill:#53657a}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#53657a"/></marker>
  </defs>
  <rect x="1" y="1" width="1448" height="838" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="58" y="62" class="title">Compatibility of crossing unit-width strips</text>
  <text x="58" y="96" class="body">For unit-width strips with the same EI, their common center must have the same deflection.</text>
  <line x1="58" y1="122" x2="1392" y2="122" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Square panel -->
  <text x="105" y="174" class="body">Square panel: equal spans</text>
  <rect x="165" y="245" width="310" height="310" fill="#f8fafc" stroke="#53657a" stroke-width="2.2"/>
  <rect x="300" y="247" width="40" height="306" fill="#d8e3ef"/>
  <rect x="167" y="380" width="306" height="40" fill="#e8edf3"/>
  <line x1="320" y1="245" x2="320" y2="555" stroke="#90a4ba" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="165" y1="400" x2="475" y2="400" stroke="#90a4ba" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="311" y="391" width="18" height="18" fill="#3c4d63"/>
  <line x1="340" y1="300" x2="450" y2="242" stroke="#53657a" stroke-width="1.2"/><text x="456" y="241" class="label">x strip</text><text x="456" y="264" class="small">unit width; load wₓ</text>
  <line x1="230" y1="420" x2="135" y2="464" stroke="#53657a" stroke-width="1.2"/><text x="57" y="482" class="label">y strip</text><text x="57" y="505" class="small">unit width; load wᵧ</text>
  <line x1="125" y1="245" x2="125" y2="555" stroke="#53657a" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="78" y="408" class="math">ℓₓ</text>
  <line x1="165" y1="590" x2="475" y2="590" stroke="#53657a" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="306" y="627" class="math">ℓᵧ = ℓₓ</text>
  <text x="170" y="682" class="result">wₓ = wᵧ = w / 2</text>

  <!-- Separator -->
  <line x1="690" y1="150" x2="690" y2="690" stroke="#d5dde7" stroke-width="2"/>

  <!-- Rectangular panel -->
  <text x="795" y="174" class="body">Rectangular panel: long-to-short ratio = 2</text>
  <rect x="845" y="302" width="465" height="232" fill="#f8fafc" stroke="#53657a" stroke-width="2.2"/>
  <rect x="1057" y="304" width="40" height="228" fill="#d8e3ef"/>
  <rect x="847" y="398" width="461" height="40" fill="#e8edf3"/>
  <line x1="1077" y1="302" x2="1077" y2="534" stroke="#90a4ba" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="845" y1="418" x2="1310" y2="418" stroke="#90a4ba" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="1068" y="409" width="18" height="18" fill="#3c4d63"/>
  <line x1="1097" y1="347" x2="1213" y2="283" stroke="#53657a" stroke-width="1.2"/><text x="1219" y="282" class="label">x strip: short span</text><text x="1219" y="305" class="small">unit width; load wₓ</text>
  <line x1="960" y1="439" x2="865" y2="475" stroke="#53657a" stroke-width="1.2"/><text x="725" y="486" class="label">y strip: long span</text><text x="725" y="509" class="small">unit width; load wᵧ</text>
  <line x1="805" y1="302" x2="805" y2="534" stroke="#53657a" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="756" y="425" class="math">ℓₓ</text>
  <line x1="845" y1="570" x2="1310" y2="570" stroke="#53657a" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1024" y="607" class="math">ℓᵧ = 2ℓₓ</text>
  <text x="850" y="662" class="math">δₓ = δᵧ  →  wₓℓₓ⁴ = wᵧℓᵧ⁴</text>
  <text x="850" y="702" class="result">wₓ / wᵧ = (ℓᵧ / ℓₓ)⁴ = 2⁴ = 16</text>
  <text x="850" y="734" class="body">wₓ = 16wᵧ  →  wₓ = 16/17 w ≈ 94% of the total load</text>

</svg>
